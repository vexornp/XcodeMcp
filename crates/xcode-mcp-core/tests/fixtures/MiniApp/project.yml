name: MiniApp
options:
  bundleIdPrefix: com.xcode-mcp.test
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true
targets:
  MiniApp:
    type: tool
    platform: macOS
    sources:
      - path: Sources/MiniApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: "$(TARGET_NAME)"
  MiniAppBroken:
    type: tool
    platform: macOS
    sources:
      - path: Sources/MiniAppBroken
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: "$(TARGET_NAME)"
