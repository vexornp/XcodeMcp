name: MiniApp
options:
  bundleIdPrefix: com.xcode-mcp.test
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
targets:
  MiniApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/MiniApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
  MiniAppBroken:
    type: application
    platform: iOS
    sources:
      - path: Sources/MiniAppBroken
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
