name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/version = "([^"]+)".*/\1/')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::tag '$TAG' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi

      - name: Download tarball and compute sha256
        id: tarball
        run: |
          TARBALL="/tmp/${GITHUB_REF_NAME}.tar.gz"
          curl -fL "https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o "$TARBALL"
          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Render formula
        run: |
          mkdir -p /tmp/rendered
          sed -e "s|{{TAG}}|${GITHUB_REF_NAME}|g" \
              -e "s|{{SHA256}}|${{ steps.tarball.outputs.sha256 }}|g" \
              Formula/xcode-mcp.rb > /tmp/rendered/xcode-mcp.rb
          echo "=== Rendered formula ==="
          cat /tmp/rendered/xcode-mcp.rb

      - name: Sync formula to homebrew-xcode-mcp tap
        env:
          TAP_REPO_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          if [ -z "$TAP_REPO_TOKEN" ]; then
            echo "::error::TAP_REPO_TOKEN secret is not set. Create a fine-grained PAT with Contents:write on vexornp/homebrew-xcode-mcp and add it as a repo secret."
            exit 1
          fi
          TAP_DIR="/tmp/homebrew-xcode-mcp"
          rm -rf "$TAP_DIR"
          git clone "https://x-access-token:${TAP_REPO_TOKEN}@github.com/vexornp/homebrew-xcode-mcp.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          cp /tmp/rendered/xcode-mcp.rb "$TAP_DIR/Formula/xcode-mcp.rb"
          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/xcode-mcp.rb
          if git diff --cached --quiet; then
            echo "    (tap formula unchanged, skipping push)"
          else
            git commit -m "chore: bump to ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, leaving as-is"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
